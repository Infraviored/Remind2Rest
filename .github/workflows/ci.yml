name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint and syntax check
        run: |
          python -m py_compile Remind2Rest.py notifications.py tray_icon.py web_configurator.py || true

      - name: Smoke import (skip tray_icon if gi missing)
        run: |
          python - <<PY
          import importlib.util, sys

          files = ["Remind2Rest.py", "notifications.py", "web_configurator.py"]

          try:
              import gi  # Optional dependency for tray_icon
              files.append("tray_icon.py")
          except Exception:
              print("Skipping tray_icon.py import: gi not available")

          for f in files:
              spec = importlib.util.spec_from_file_location("mod", f)
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
                  print(f"Imported {f} OK")
              except Exception as e:
                  print(f"Import {f} failed: {e}")
                  sys.exit(1)
          PY
