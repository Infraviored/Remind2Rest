<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathing</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="breathing.css">
</head>
<body>
<header>
    <h1>4-7-8 breathing</h1>
    <p id="cycle">&nbsp;</p>
</header>

<div class="breath">
    <!-- Outer ring: the full size of an inhale. Arc: progress of the current phase. -->
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" class="track"/>
        <circle cx="50" cy="50" r="48" class="arc" id="arc" pathLength="1"/>
    </svg>
    <div class="orb" id="orb"></div>
    <div class="label">
        <p class="phase" id="phase">&nbsp;</p>
        <p class="left" id="left">&nbsp;</p>
    </div>
</div>

<button class="skip" id="skip">Skip</button>
<div class="esc-hint"><kbd>Esc</kbd> skips</div>

<script src="../common.js"></script>
<script src="breathing.js"></script>
</body>
</html>
