<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="water.css">
</head>
<body>
<div class="veil"></div>

<div class="stage">
    <header>
        <h1 id="title">Time for some water</h1>
        <p class="status" id="status">&nbsp;</p>
        <div class="progress"><div class="fill" id="fill"></div></div>
    </header>

    <!-- Drop a glass here to drink it. -->
    <div class="target-wrap">
        <div class="target" id="target">
            <span class="ripple"></span>
            <span class="ripple r2"></span>
            <span class="target-text">Drink here</span>
        </div>
    </div>

    <!-- water.js draws the glass inside each slot. -->
    <div class="glasses" id="glasses">
        <div class="glass" data-ml="200" data-key="1" role="button" aria-label="200 ml glass, key 1"></div>
        <div class="glass" data-ml="300" data-key="2" role="button" aria-label="300 ml glass, key 2"></div>
        <div class="glass" data-ml="500" data-key="3" role="button" aria-label="500 ml glass, key 3"></div>
    </div>

    <div class="actions" id="actions">
        <span class="hint">Drag a glass to the circle, or press 1, 2 or 3</span>
        <button class="secondary" id="later">Later</button>
    </div>
</div>
<div class="esc-hint"><kbd>Esc</kbd> closes</div>

<script src="../common.js"></script>
<script src="water.js"></script>
</body>
</html>
