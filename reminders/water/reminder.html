<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="water.css">
</head>
<body>
<div class="veil"></div>

<!-- One button per amount; water.js draws the glass inside each. -->
<div class="glasses" id="glasses">
    <button class="glass" data-ml="200" aria-label="Drank 200 ml"></button>
    <button class="glass" data-ml="300" aria-label="Drank 300 ml"></button>
    <button class="glass" data-ml="500" aria-label="Drank 500 ml"></button>
</div>

<main>
    <h1 id="title">Time for some water</h1>
    <p class="status" id="status">&nbsp;</p>
    <div class="progress"><div class="fill" id="fill"></div></div>
    <div class="actions" id="actions">
        <button class="secondary" id="later">Later</button>
    </div>
</main>
<div class="esc-hint"><kbd>Esc</kbd> closes</div>

<script src="../common.js"></script>
<script src="water.js"></script>
</body>
</html>
